name: Live-API smoke

# Explicit manual check of public endpoints. No real API keys, issue publishing,
# or autonomous follow-up agent. External response data stays in the run log.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --prefix mcp-server --ignore-scripts
      - name: Build
        run: npm run build --prefix mcp-server
      - name: Check public APIs
        env:
          CHAINGPT_API_KEY: smoke-test
          CHAINGPT_DISABLE_KEYCHAIN: '1'
          CHAINGPT_USAGE: 'off'
        run: node mcp-server/dist/smoke-test.js
