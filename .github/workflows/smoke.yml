name: Live-API smoke

# Runs the smoke test against real public APIs on a schedule and on-demand.
# External API bodies are untrusted data. They are retained in the protected
# workflow log for manual review but are never copied into issues or passed to
# an autonomous code-writing workflow.

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to test (default: main)'
        required: false
        default: 'main'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.inputs.ref || 'main' }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json

      - name: Install deps
        run: cd mcp-server && npm ci

      - name: Compile TypeScript
        run: cd mcp-server && node node_modules/typescript/bin/tsc

      - name: Run live-API smoke
        id: smoke
        env:
          # CHAINGPT_API_KEY is required for the server to boot, but the
          # read-only smoke cases never hit the ChainGPT plugin API itself.
          CHAINGPT_API_KEY: ${{ secrets.CHAINGPT_API_KEY || 'smoke-test' }}
          MORALIS_API_KEY: ${{ secrets.MORALIS_API_KEY }}
          ONEINCH_API_KEY: ${{ secrets.ONEINCH_API_KEY }}
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
        run: |
          cd mcp-server
          set +e
          node dist/smoke-test.js 2>&1 | tee smoke-output.txt
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit $code

      - name: Update rolling issue without embedding external response data
        if: ${{ always() && github.event_name == 'schedule' }}
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const failed = '${{ steps.smoke.outcome }}' === 'failure';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const today = new Date().toISOString().slice(0, 10);
            const safety = 'The workflow log contains untrusted external API data. Review it manually; do not paste it into an autonomous agent.';
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'smoke-failure',
              per_page: 50,
            });
            const rolling = open.find((i) => i.title.startsWith('[smoke] Live-API smoke failing'));

            if (failed) {
              const update = [
                `**${today} — still failing.** [Review the protected run log](${runUrl}).`,
                '',
                safety,
              ].join('\n');
              if (rolling) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: rolling.number, body: update,
                });
                core.info(`Commented on rolling issue #${rolling.number}.`);
              } else {
                await github.rest.issues.create({
                  owner: context.repo.owner, repo: context.repo.repo,
                  title: '[smoke] Live-API smoke failing',
                  body: [
                    'The scheduled live-API smoke is failing. This issue stays open until a green run closes it.',
                    '',
                    'Likely causes include upstream API drift, rate limiting, authentication failure, or a moved endpoint.',
                    '',
                    update,
                  ].join('\n'),
                  labels: ['smoke-failure', 'live-api'],
                });
                core.info('Opened new rolling smoke-failure issue.');
              }
            } else if ('${{ steps.smoke.outcome }}' === 'success' && rolling) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: rolling.number,
                body: `**${today} — recovered.** Smoke is green again: [run log](${runUrl}). Auto-closing.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: rolling.number, state: 'closed',
              });
              core.info(`Closed rolling issue #${rolling.number} after green run.`);
            } else if (rolling) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: rolling.number,
                body: `**${today} — inconclusive** (run outcome: ${{ toJSON(steps.smoke.outcome) }}). [Run log](${runUrl}). Issue stays open.`,
              });
            } else {
              core.info('No open rolling issue — nothing to do.');
            }
