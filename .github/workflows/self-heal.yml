name: Autonomous self-heal (disabled)

# SECURITY HOLD — AUGUST 2026 INCIDENT
#
# The former workflow automatically consumed live external API responses and
# invoked a Claude agent with Bash, WebFetch, repository-write, PR-write,
# issue-write, and OIDC authority. That combination allowed untrusted upstream
# data to influence an autonomous code-writing process in a privileged CI
# context. It is intentionally disabled pending a separately reviewed redesign.
#
# Do not restore workflow_run, repository write permissions, broad Claude tools,
# or automatic branch/PR creation without an approved threat model, immutable
# action pins, isolated credentials, prompt-injection tests, and human approval.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-hold:
    name: Autonomous self-heal remains disabled
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Block execution
        shell: bash
        run: |
          echo "::error::Autonomous self-heal is disabled after the August 2026 supply-chain incident. Use a human-reviewed incident workflow instead."
          exit 1
